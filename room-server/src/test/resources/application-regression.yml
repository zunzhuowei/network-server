spring:
  main:
    allow-bean-definition-overriding: true

hbsoo:
  server:
    id: 3000
    tcpHeader: THBS
    udpHeader: UHBS
    threadPoolSize:
      insideClient: 2
      insideServer: 2
      outsideServer: 2
    insideServers:
      - host: 127.0.0.1
        port: 26000
        type: gateway
        id: 1000
      - host: 127.0.0.1
        port: 26003
        type: hall
        id: 2000
      - host: 127.0.0.1
        port: 26006
        type: room
        id: 3000

logging:
  level:
    com.hbsoo: warn
